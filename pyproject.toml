[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simunet"
version = "0.1.0"
description = "Simunet package"
authors = [
  { name="User", email="user@example.com" },
]
dependencies = [
    "nnpdf>=4.1.2",
    "seaborn>=0.12",
]
requires-python = ">=3.9"

[project.scripts]
simunet = "simunet.app:main"
simun3fit = "simunet.simufit.simun3fit_exec:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
skip-string-normalization = true
skip-magic-trailing-comma = true

[tool.isort]
atomic = true
line_length = 100
profile = "black" # https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html#custom-configuration
skip_gitignore = true
known_first_party = ["validphys", "eko", "n3fit", "nnpdf_data", "reportengine", "simunet"]
force_sort_within_sections = true
